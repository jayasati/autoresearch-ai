[project]
name = "autoresearch-ai-backend"
version = "0.1.0"
description = "Evidence-grounded agentic research system -- backend"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migration scripts are generated by `alembic revision --autogenerate` and are not
# hand-edited. Reformatting them would make every future autogenerate diff noisy,
# and rewriting their imports risks breaking a file that must stay runnable forever.
"migrations/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
